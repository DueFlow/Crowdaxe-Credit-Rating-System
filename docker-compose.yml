# Development services. `docker compose up -d db` starts PostgreSQL 16 for local development and tests.
# The application container is added in Phase 7.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crs_dev
    ports:
      - '5432:5432'
    volumes:
      - crs-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
volumes:
  crs-db:
